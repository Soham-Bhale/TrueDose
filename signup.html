<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogicLens - Sign Up</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css"> 
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .nav-link {
            color: #efd8fb; 
            transition: color 0.2s ease, background-color 0.2s ease;
            font-size: 1.125rem; 
            font-weight: 500;    
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            background-color: rgba(0, 0, 0, 0.2); 
        }
        .nav-link:hover {
            color: #d1b8f5; 
            background-color: rgba(147, 112, 219, 0.3);
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-purple-900 via-blue-900 to-black min-h-screen flex flex-col text-white">

    <header class="p-4 md:p-6 bg-purple-900 bg-opacity-70 shadow-lg rounded-b-xl mx-4 mt-4 md:mx-8 md:mt-8 flex justify-between items-center">
        <h1 class="text-3xl md:text-4xl font-bold text-pink-300">LogicLens</h1>
        <nav class="flex space-x-4 md:space-x-6">
            <a href="index.html" class="nav-link">Home</a>
            <a href="about.html" class="nav-link">About Us</a>
            <a href="login.html" id="navLogin" class="nav-link">Login</a>
            <a href="signup.html" id="navSignup" class="nav-link">Sign Up</a>
            <a href="results.html#history" id="navHistory" class="nav-link hidden">History</a>
            <span id="userEmailDisplay" class="text-white text-md font-medium hidden md:block"></span>
            <button id="navLogout" class="nav-link hidden bg-red-600 hover:bg-red-700 px-3 py-1 rounded-md">Logout</button>
        </nav>
    </header>

    <main class="flex-grow container mx-auto p-4 md:p-8 flex flex-col items-center justify-center">
        <section class="bg-gray-800 bg-opacity-85 shadow-2xl backdrop-filter backdrop-blur-sm p-6 md:p-10 rounded-2xl border border-purple-700 w-full max-w-md">
            <h2 class="text-2xl md:text-3xl font-semibold text-pink-300 mb-8 text-center">Create Your LogicLens Account</h2>

            <form id="signupForm" class="space-y-6">
                <div>
                    <label for="email" class="block text-lg font-medium text-blue-300 mb-2">Email Address:</label>
                    <input type="email" id="email" name="email" required
                           class="w-full p-3 rounded-lg bg-gray-700 border border-purple-600 text-white focus:outline-none focus:ring-2 focus:ring-pink-500"
                           placeholder="your.email@example.com">
                </div>
                <div>
                    <label for="password" class="block text-lg font-medium text-blue-300 mb-2">Password:</label>
                    <input type="password" id="password" name="password" required
                           class="w-full p-3 rounded-lg bg-gray-700 border border-purple-600 text-white focus:outline-none focus:ring-2 focus:ring-pink-500"
                           placeholder="••••••••">
                </div>
                <div>
                    <label for="confirmPassword" class="block text-lg font-medium text-blue-300 mb-2">Confirm Password:</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required
                           class="w-full p-3 rounded-lg bg-gray-700 border border-purple-600 text-white focus:outline-none focus:ring-2 focus:ring-pink-500"
                           placeholder="••••••••">
                </div>
                
                <button type="submit"
                        class="w-full py-3 px-6 rounded-lg bg-gradient-to-r from-pink-500 to-purple-600 text-white font-bold text-lg hover:from-pink-600 hover:to-purple-700 transition duration-300 ease-in-out shadow-lg">
                    Sign Up
                </button>
            </form>

            <p class="text-center text-gray-400 mt-6">
                Already have an account? 
                <a href="login.html" class="text-blue-400 hover:text-blue-300 font-medium transition-colors duration-200">Login here</a>
            </p>
        </section>
    </main>

    <footer class="p-4 md:p-6 bg-black bg-opacity-70 shadow-inner rounded-t-xl mx-4 mb-4 md:mx-8 md:mb-8 text-center text-gray-400 text-sm">
        &copy; 2025 LogicLens. All rights reserved.
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithCustomToken, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        // Firebase Client-side Configuration (Hardcoded for local development)
        const firebaseConfig = {
          apiKey: "AIzaSyCaSUNkEUPveP1m9X4HmMHsrl570GXUCDg",
          authDomain: "logiclens-882c6.firebaseapp.com",
          projectId: "logiclens-882c6",
          storageBucket: "logiclens-882c6.firebasestorage.app",
          messagingSenderId: "522388336403",
          appId: "1:522388336403:web:a597fcc2c8bf526a3f74e6",
          measurementId: "G-N528RTE02G"
        };
        const appId = firebaseConfig.projectId; // Using projectId for consistency with backend artifact paths

        let app;
        let auth;

        // Initialize Firebase on client-side if config is available
        if (Object.keys(firebaseConfig).length > 0) {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            console.log("Firebase client-side initialized.");
        } else {
            console.warn("Firebase config not available. Client-side authentication will not function.");
        }

        function updateNavForAuthState() {
            const loggedInUserId = sessionStorage.getItem('loggedInUserId');
            const loggedInUserEmail = sessionStorage.getItem('loggedInUserEmail');
            
            const navLogin = document.getElementById('navLogin');
            const navSignup = document.getElementById('navSignup');
            const navHistory = document.getElementById('navHistory');
            const navLogout = document.getElementById('navLogout');
            const userEmailDisplay = document.getElementById('userEmailDisplay');

            if (loggedInUserId && loggedInUserEmail) {
                navLogin.classList.add('hidden');
                navSignup.classList.add('hidden');
                navHistory.classList.remove('hidden');
                navLogout.classList.remove('hidden');
                userEmailDisplay.classList.remove('hidden');
                userEmailDisplay.textContent = `(${loggedInUserEmail})`;

                if (!navLogout.hasListener) {
                    navLogout.addEventListener('click', async function(e) {
                        e.preventDefault();
                        if (auth) {
                            try {
                                await signOut(auth);
                                console.log("Firebase client-side signed out.");
                            } catch (error) {
                                console.error("Error signing out from Firebase client:", error);
                            }
                        }
                        sessionStorage.clear();
                        alert('You have been logged out.');
                        window.location.href = 'index.html'; 
                    });
                    navLogout.hasListener = true;
                }
            } else {
                navLogin.classList.remove('hidden');
                navSignup.classList.remove('hidden');
                navHistory.classList.add('hidden');
                navLogout.classList.add('hidden');
                userEmailDisplay.classList.add('hidden');
                userEmailDisplay.textContent = '';
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            updateNavForAuthState(); // Set nav state on page load

            document.getElementById('signupForm').addEventListener('submit', async function(event) {
                event.preventDefault();

                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const confirmPassword = document.getElementById('confirmPassword').value;

                if (password !== confirmPassword) {
                    alert('Passwords do not match!');
                    return;
                }

                try {
                    const response = await fetch('http://127.0.0.1:5000/signup', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password })
                    });
                    const data = await response.json();

                    if (response.ok && data.token && data.user_id) {
                        // For signup, we just redirect to login; user will login with email/password
                        // after creation. No need to sign in with custom token here.
                        sessionStorage.setItem('loggedInUserId', data.user_id); // Temporarily store ID
                        sessionStorage.setItem('loggedInUserEmail', email); // Temporarily store email
                        sessionStorage.setItem('idToken', data.token); // Store token

                        alert('Account created successfully! Please log in.');
                        window.location.href = 'login.html'; 
                    } else {
                        alert('Signup failed: ' + (data.error || 'An error occurred.'));
                    }
                } catch (error) {
                    console.error('Error during signup:', error);
                    alert('An error occurred during signup. Please try again later.');
                }
            });
        });
    </script>
</body>
</html>
