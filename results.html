<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogicLens - Debug Results</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- CodeMirror CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <!-- CodeMirror Theme (Dracula for consistency) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* New styles for structured debug output */
        .debug-section {
            background-color: rgba(40, 40, 40, 0.7); /* Slightly lighter dark gray */
            border-left: 4px solid #9370db; /* Purple accent border */
            padding: 1rem 1.5rem;
            margin-bottom: 1rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }
        .debug-section h3 {
            color: #87ceeb; /* Sky blue for section titles */
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 0.8rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid rgba(135, 206, 235, 0.3); /* Light blue separator */
        }
        .debug-section p, .debug-section ul {
            color: #e0e0e0;
            font-size: 0.95rem;
            line-height: 1.6;
        }
        .debug-section ul {
            list-style-type: disc;
            margin-left: 1.5rem;
            padding-left: 0;
        }

        /* Styles for CodeMirror editor in results.html */
        .CodeMirror {
            border: 1px solid #6a5acd; /* Matching border from CodeMirror on index.html */
            border-radius: 10px; /* Matching border-radius */
            font-family: 'Fira Code', 'Cascadia Code', 'Consolas', monospace; /* Monospace font */
            font-size: 0.95rem; /* Slightly adjusted font size */
            height: auto; /* Let content define height */
            min-height: 200px; /* Minimum height */
            margin-top: 1rem; /* Space between header and editor */
        }
        /* Ensure CodeMirror's scrollbars match the theme if possible */
        .CodeMirror-vscrollbar, .CodeMirror-hscrollbar {
            background-color: #2a2a2a;
        }
        .CodeMirror-vscrollbar::-webkit-scrollbar-thumb,
        .CodeMirror-hscrollbar::-webkit-scrollbar-thumb {
            background-color: #9370db;
            border-radius: 5px;
        }
        .CodeMirror-vscrollbar::-webkit-scrollbar-track,
        .CodeMirror-hscrollbar::-webkit-scrollbar-track {
            background-color: #2a2a2a;
        }
        /* Adjusting line numbers color */
        .CodeMirror-linenumber {
            color: #87ceeb !important; /* Sky blue for line numbers */
        }
        /* Override default CodeMirror background for dracula theme if needed */
        .cm-s-dracula.CodeMirror {
            background-color: #282a36 !important; /* Dracula background color */
        }
        /* Ensure cursor and selection colors match dracula theme better */
        .CodeMirror-cursor {
            border-left: 1px solid #f8f8f2 !important; /* White cursor */
        }
        .CodeMirror-activeline-background {
            background: rgba(255, 255, 255, 0.05) !important; /* Slightly lighter active line */
        }
        .CodeMirror-selected {
            background: rgba(98, 114, 164, 0.4) !important; /* Selection color from dracula */
        }


        .debug-results-container {
            margin-top: 2rem;
            width: 100%;
            background-color: rgba(30, 30, 30, 0.85); /* Match section background */
            padding: 1.5rem;
            border-radius: 15px;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5); /* Inner shadow */
        }
        /* Specific styling for results page layout */
        .results-main-content {
            background-color: rgba(30, 30, 30, 0.85);
            box-shadow: 0 10px 40px 0 rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border-radius: 20px;
            padding: 2.5rem;
            width: 95%;
            max-width: 900px;
            margin: 2rem auto;
            border: 1px solid rgba(147, 112, 219, 0.4);
        }
        /* Styles for the copy button */
        .copy-button {
            padding: 0.5rem 1.25rem;
            min-width: 100px;
            text-align: center;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
        }
        .copy-button:hover {
            transform: translateY(-1px);
        }
        .copy-button:active {
            transform: translateY(0);
        }

        /* Styles for history list */
        .history-list {
            list-style: none;
            padding: 0;
            margin-top: 1rem;
        }
        .history-list li {
            background-color: rgba(60, 60, 60, 0.7);
            padding: 0.8rem 1rem;
            border-radius: 8px;
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 3px solid #ff69b4;
        }
        .history-list li:hover {
            background-color: rgba(80, 80, 80, 0.7);
            transform: translateY(-1px);
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            cursor: pointer;
        }
        .history-list .history-item-details {
            flex-grow: 1;
        }
        .history-list .history-item-date {
            font-size: 0.8rem;
            color: #a0a0a0;
            margin-top: 0.2rem;
        }
        .history-list .history-item-language {
            font-weight: 600;
            color: #87ceeb;
            margin-right: 0.5rem;
        }
        .history-list button {
            /* Small button style for history items */
            padding: 0.3rem 0.6rem;
            font-size: 0.8rem;
            margin-left: 0.5rem;
            border-radius: 6px;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-purple-900 via-blue-900 to-black min-h-screen flex flex-col text-white">
    <header class="p-4 md:p-6 bg-purple-900 bg-opacity-70 shadow-lg rounded-b-xl mx-4 mt-4 md:mx-8 md:mt-8 flex justify-between items-center">
        <h1 class="text-3xl md:text-4xl font-bold text-pink-300">LogicLens</h1>
        <nav class="flex space-x-4 md:space-x-6">
            <a href="index.html" class="nav-link">Home</a>
            <a href="about.html" class="nav-link">About Us</a>
            <a href="login.html" id="navLogin" class="nav-link">Login</a>
            <a href="signup.html" id="navSignup" class="nav-link">Sign Up</a>
            <a href="results.html#history" id="navHistory" class="nav-link hidden">History</a>
            <span id="userEmailDisplay" class="text-white text-md font-medium hidden md:block"></span>
            <button id="navLogout" class="nav-link hidden bg-red-600 hover:bg-red-700 px-3 py-1 rounded-md">Logout</button>
        </nav>
    </header>

    <main class="flex-grow container mx-auto p-4 md:p-8 flex flex-col items-center justify-center">
        <section id="resultsSection" class="results-main-content">
            <h2 class="text-2xl md:text-3xl font-semibold text-pink-300 mb-6 text-center">Debugging Results</h2>
            
            <div id="debugResultsContainer" class="debug-results-container">
                <p class="text-gray-400">Loading debugging results...</p>
            </div>

            <!-- Save button for current session -->
            <button id="saveDebugSessionButton" class="hidden mt-6 w-full py-3 px-6 rounded-lg bg-gradient-to-r from-blue-500 to-indigo-600 text-white font-bold text-lg hover:from-blue-600 hover:to-indigo-700 transition duration-300 ease-in-out shadow-lg">
                Save This Debug Session
            </button>

            <!-- Global Copy Code button at the end of the results section -->
            <button id="copyCorrectedCodeButton" class="hidden mt-4 w-full py-3 px-6 rounded-lg bg-gradient-to-r from-pink-500 to-purple-600 text-white font-bold text-lg hover:from-pink-600 hover:to-purple-700 transition duration-300 ease-in-out shadow-lg">
                Copy Corrected Code
            </button>
        </section>

        <!-- History Section (hidden by default) -->
        <section id="historySection" class="results-main-content hidden">
            <h2 class="text-2xl md:text-3xl font-semibold text-pink-300 mb-6 text-center">Debugging History</h2>
            <p id="userIdDisplay" class="text-gray-400 text-center text-sm mb-4">Your User ID: Loading...</p>
            <ul id="historyList" class="history-list">
                <li class="text-gray-400">Loading history...</li>
            </ul>
        </section>
    </main>

    <footer class="p-4 md:p-6 bg-black bg-opacity-70 shadow-inner rounded-t-xl mx-4 mb-4 md:mx-8 md:mb-8 text-center text-gray-400 text-sm">
        &copy; 2025 LogicLens. All rights reserved.
    </footer>

    <!-- CodeMirror Core Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <!-- CodeMirror Language Modes -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script> <!-- For Java -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
    
    <script type="module">
        // Firebase SDK imports
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, addDoc, deleteDoc, collection, query, serverTimestamp, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        
        // Firebase Client-side Configuration (Hardcoded for local development)
        const firebaseConfig = {
          apiKey: "AIzaSyCaSUNkEUPveP1m9X4HmMHsrl570GXUCDg",
          authDomain: "logiclens-882c6.firebaseapp.com",
          projectId: "logiclens-882c6",
          storageBucket: "logiclens-882c6.firebasestorage.app",
          messagingSenderId: "522388336403",
          appId: "1:522388336403:web:a597fcc2c8bf526a3f74e6",
          measurementId: "G-N528RTE02G"
        };
        const appId = firebaseConfig.projectId; // Using projectId for consistency with backend artifact paths

        let app;
        let db;
        let auth;
        let currentUserId = null; 
        let outputEditor; 
        let currentDebugData = null; 

        if (Object.keys(firebaseConfig).length > 0) {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
            console.log("Firebase initialized.");

            // Initial sign-in or check auth state
            onAuthStateChanged(auth, async (user) => {
                const userIdDisplay = document.getElementById('userIdDisplay');
                if (user) {
                    currentUserId = user.uid;
                    sessionStorage.setItem('loggedInUserId', user.uid);
                    sessionStorage.setItem('loggedInUserEmail', user.email || 'Anonymous User');
                    userIdDisplay.textContent = `Your User ID: ${currentUserId}`;
                    console.log("User authenticated:", currentUserId);
                } else {
                    currentUserId = null;
                    sessionStorage.removeItem('loggedInUserId');
                    sessionStorage.removeItem('loggedInUserEmail');
                    sessionStorage.removeItem('idToken');
                    console.log("No user signed in. Attempting anonymous sign-in...");
                    try {
                        // Use __initial_auth_token if provided, otherwise sign in anonymously
                        // Note: __initial_auth_token is typically for Canvas environment.
                        // For local development, this part might always fall back to signInAnonymously.
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                            console.log("Signed in with custom token.");
                        } else {
                            await signInAnonymously(auth);
                            console.log("Signed in anonymously.");
                        }
                    } catch (error) {
                        console.error("Firebase Auth Error:", error);
                        userIdDisplay.textContent = "User ID: Authentication Failed.";
                    }
                }
                updateNavForAuthState(); // Update navigation on auth state change
                // If the history section is active, load history after auth state is known
                if (!document.getElementById('historySection').classList.contains('hidden')) {
                    await loadHistory();
                }
            });

        } else {
            console.error("Firebase config is missing. Cannot initialize Firebase.");
            document.getElementById('userIdDisplay').textContent = "User ID: Firebase not configured.";
        }

        // --- Firestore Functions ---
        async function saveDebugSession(debugData, language, inputCode) {
            if (!currentUserId || !sessionStorage.getItem('idToken')) {
                alert("Please log in to save your debugging sessions.");
                console.error("Cannot save: User not authenticated or token missing.");
                return;
            }

            try {
                const idToken = sessionStorage.getItem('idToken'); // Get JWT token
                if (!idToken) {
                    alert("Authentication token missing. Please log in again.");
                    return;
                }

                // Construct backendUrl correctly
                const backendUrl = 'http://127.0.0.1:5000/save-history'; 

                const response = await fetch(backendUrl, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'x-access-token': idToken // Send JWT token
                    },
                    body: JSON.stringify({ 
                        language: language,
                        inputCode: inputCode,
                        debugOutput: JSON.stringify(debugData) // Ensure debugData is stringified for storage
                    }) 
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || `Failed to save history with status: ${response.status}`);
                }

                console.log("Debug session saved successfully!");
                document.getElementById('saveDebugSessionButton').textContent = 'Saved!';
                setTimeout(() => {
                    document.getElementById('saveDebugSessionButton').textContent = 'Save This Debug Session';
                }, 2000);
            } catch (error) {
                console.error("Error saving debug session:", error);
                document.getElementById('saveDebugSessionButton').textContent = 'Save Failed!';
                setTimeout(() => {
                    document.getElementById('saveDebugSessionButton').textContent = 'Save This Debug Session';
                }, 2000);
                alert("Failed to save session: " + error.message + ". Please check your internet connection or try again.");
            }
        }

        async function loadHistory() {
            const historyList = document.getElementById('historyList');
            historyList.innerHTML = '<li class="text-gray-400">Loading history...</li>';

            if (!currentUserId || !sessionStorage.getItem('idToken')) {
                historyList.innerHTML = '<p class="text-red-400 text-center">Please log in to view your history.</p>'; // Changed to p tag
                return;
            }

            try {
                const idToken = sessionStorage.getItem('idToken'); // Get JWT token
                if (!idToken) {
                    historyList.innerHTML = '<p class="text-red-400 text-center">Authentication token missing. Please log in again to load history.</p>'; // Changed to p tag
                    return;
                }

                // Corrected backendUrl for get-history (no user ID in path)
                const backendUrl = 'http://127.0.0.1:5000/get-history'; 

                const response = await fetch(backendUrl, {
                    method: 'GET',
                    headers: { 
                        'x-access-token': idToken // Send JWT token
                    }
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || `Failed to fetch history with status: ${response.status}`);
                }
                const result = await response.json();
                const history = result.history; // Access the 'history' array from the response
                
                historyList.innerHTML = ''; // Clear loading message

                if (history.length === 0) {
                    historyList.innerHTML = '<p class="text-gray-400 text-center">No debug history found for this account. Debug some code on the <a href="index.html" class="text-blue-300 hover:underline">Home page</a> to save your first session!</p>';
                } else {
                    history.forEach(item => { // Changed session to item for consistency with results.html
                        const li = document.createElement('li'); // Changed to li for list item, not div
                        li.classList.add('history-item'); // Changed to history-item for styling consistent with results.html
                        
                        // Parse debugOutput which is stored as a JSON string
                        let parsedDebugOutput;
                        try {
                            parsedDebugOutput = JSON.parse(item.debugOutput);
                        } catch (e) {
                            console.error('Error parsing debugOutput for history item:', item.id, e);
                            parsedDebugOutput = {}; // Fallback to empty object
                        }

                        // Convert Firestore Timestamp to Date object
                        const date = item.timestamp && item.timestamp._seconds ? new Date(item.timestamp._seconds * 1000).toLocaleString() : 'N/A';
                        const summary = parsedDebugOutput.summary || 'No summary';
                        const language = item.language || 'Unknown';

                        li.innerHTML = `
                            <div class="history-item-details">
                                <span class="history-item-language">${language.toUpperCase()}</span>
                                ${summary}
                                <div class="history-item-date">${date}</div>
                            </div>
                            <button class="bg-blue-600 hover:bg-blue-700 text-white copy-button view-history-button" data-id="${item.id}">View</button>
                            <button class="bg-red-600 hover:bg-red-700 text-white copy-button ml-2 delete-history-button" data-id="${item.id}">Delete</button>
                        `;
                        historyList.appendChild(li);

                        li.querySelector('.view-history-button').addEventListener('click', () => {
                            // Pass the entire session object directly for easier access in viewSessionDetails
                            displayDebugResults(parsedDebugOutput, item.language);
                            currentDebugData = { debugOutput: parsedDebugOutput, language: item.language, inputCode: item.inputCode };

                            document.getElementById('resultsSection').classList.remove('hidden');
                            document.getElementById('historySection').classList.add('hidden');
                            
                            if (parsedDebugOutput.corrected_code && parsedDebugOutput.corrected_code.trim() !== '') {
                                document.getElementById('copyCorrectedCodeButton').classList.remove('hidden');
                            } else {
                                document.getElementById('copyCorrectedCodeButton').classList.add('hidden');
                            }
                            // Only show save button if user is authenticated
                            if (sessionStorage.getItem('loggedInUserId')) {
                                document.getElementById('saveDebugSessionButton').classList.remove('hidden'); 
                            } else {
                                document.getElementById('saveDebugSessionButton').classList.add('hidden'); 
                            }
                        });

                        li.querySelector('.delete-history-button').addEventListener('click', async () => {
                            if (confirm("Are you sure you want to delete this session?")) {
                                await deleteDebugSession(item.id);
                                loadHistory(); // Reload history after deletion
                            }
                        });
                    });
                }

            } catch (error) {
                console.error("Error loading history:", error);
                historyList.innerHTML = '<li class="text-red-400">Failed to load history: ' + error.message + '. Please ensure you are logged in and have internet access.</li>';
            }
        }

        async function deleteDebugSession(sessionId) {
            if (!currentUserId || !sessionStorage.getItem('idToken')) {
                alert("Cannot delete: Please log in.");
                console.error("Cannot delete: User not authenticated or token missing.");
                return;
            }
            try {
                const idToken = sessionStorage.getItem('idToken'); // Get JWT token
                if (!idToken) {
                    alert("Authentication token missing. Please log in again to delete history.");
                    return;
                }

                // Corrected backendUrl for delete-history (only session ID in path)
                const backendUrl = `http://127.0.0.1:5000/delete-history/${sessionId}`; 

                const response = await fetch(backendUrl, {
                    method: 'DELETE',
                    headers: { 
                        'x-access-token': idToken // Send JWT token
                    }
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || `Failed to delete history with status: ${response.status}`);
                }
                console.log("Session deleted successfully:", sessionId);
                alert("Session deleted successfully!");
                loadHistory(); // Reload history after deletion
            }
            catch (error) {
                console.error("Error deleting session:", error);
                alert("Failed to delete session: " + error.message + ". Please try again.");
            }
        }

        // Function to update navigation visibility based on authentication status
        function updateNavForAuthState() {
            const loggedInUserId = sessionStorage.getItem('loggedInUserId');
            const loggedInUserEmail = sessionStorage.getItem('loggedInUserEmail');
            
            const navLogin = document.getElementById('navLogin');
            const navSignup = document.getElementById('navSignup');
            const navHistory = document.getElementById('navHistory');
            const navLogout = document.getElementById('navLogout');
            const userEmailDisplay = document.getElementById('userEmailDisplay');

            if (loggedInUserId) {
                navLogin.classList.add('hidden');
                navSignup.classList.add('hidden');
                navHistory.classList.remove('hidden');
                navLogout.classList.remove('hidden');
                userEmailDisplay.classList.remove('hidden');
                userEmailDisplay.textContent = `(${loggedInUserEmail})`;

                // Add event listener for logout button if not already added
                if (!navLogout.hasListener) { 
                    navLogout.addEventListener('click', async function(e) {
                        e.preventDefault();
                        if (auth) {
                            try {
                                await signOut(auth); // Sign out from Firebase client
                                console.log("Firebase client-side signed out.");
                            } catch (error) {
                                console.error("Error signing out from Firebase client:", error);
                            }
                        }
                        sessionStorage.clear(); // Clear all session data
                        alert('You have been logged out.');
                        window.location.href = 'index.html'; 
                    });
                    navLogout.hasListener = true;
                }
                
                // Add event listener for history button if not already added
                if (!navHistory.hasListener) { 
                    navHistory.addEventListener('click', function(e) {
                        e.preventDefault();
                        window.location.href = 'results.html#history';
                    });
                    navHistory.hasListener = true;
                }

            } else {
                navLogin.classList.remove('hidden');
                navSignup.classList.remove('hidden');
                navHistory.classList.add('hidden');
                navLogout.classList.add('hidden');
                userEmailDisplay.classList.add('hidden');
                userEmailDisplay.textContent = '';
            }
        }

        // --- Main Script Logic ---
        document.addEventListener('DOMContentLoaded', function() {
            console.log("results.html script loaded and DOMContentLoaded fired.");
            
            updateNavForAuthState(); // Initial call to set nav state

            const debugResultsContainer = document.getElementById('debugResultsContainer');
            const saveDebugSessionButton = document.getElementById('saveDebugSessionButton');
            const copyCorrectedCodeButton = document.getElementById('copyCorrectedCodeButton');
            const resultsSection = document.getElementById('resultsSection');
            const historySection = document.getElementById('historySection');

            // Handle initial display based on session storage or URL hash
            const storedResults = sessionStorage.getItem('debugResults');
            const storedLanguage = sessionStorage.getItem('debugLanguage');
            const storedInputCode = sessionStorage.getItem('debugInputCode');

            if (window.location.hash === '#history') {
                resultsSection.classList.add('hidden');
                historySection.classList.remove('hidden');
                // loadHistory will be called by onAuthStateChanged when user state is known
            } else if (storedResults && storedLanguage) {
                try {
                    const debugData = JSON.parse(storedResults);
                    displayDebugResults(debugData, storedLanguage);
                    currentDebugData = { debugOutput: debugData, language: storedLanguage, inputCode: storedInputCode };
                    
                    // Only show save button if user is authenticated
                    if (sessionStorage.getItem('loggedInUserId')) {
                        saveDebugSessionButton.classList.remove('hidden');
                    } else {
                        saveDebugSessionButton.classList.add('hidden');
                    }

                    if (debugData.corrected_code && debugData.corrected_code.trim() !== '') {
                        copyCorrectedCodeButton.classList.remove('hidden');
                    } else {
                        copyCorrectedCodeButton.classList.add('hidden');
                    }
                    // Do NOT clear session storage here. Data should persist.

                } catch (e) {
                    debugResultsContainer.innerHTML = '<p class="text-red-400">Error parsing stored results. Please go back to the <a href="index.html" class="text-blue-300 hover:text-pink-300">home page</a> to debug some code.</p>';
                    console.error('Error parsing debugResults from sessionStorage:', e);
                    saveDebugSessionButton.classList.add('hidden');
                    copyCorrectedCodeButton.classList.add('hidden');
                }
            } else {
                debugResultsContainer.innerHTML = '<p class="text-gray-400">No debugging results found. Please go back to the <a href="index.html" class="text-blue-300 hover:text-pink-300">home page</a> to debug some code.</p>';
                saveDebugSessionButton.classList.add('hidden');
                copyCorrectedCodeButton.classList.add('hidden');
            }

            // --- Event Listeners ---
            saveDebugSessionButton.addEventListener('click', async () => {
                if (currentDebugData) {
                    await saveDebugSession(currentDebugData.debugOutput, currentDebugData.language, currentDebugData.inputCode);
                } else {
                    alert("No current debug session to save. Please debug some code first.");
                    console.warn("No current debug session to save.");
                }
            });

            copyCorrectedCodeButton.addEventListener('click', async () => {
                const codeToCopy = outputEditor ? outputEditor.getValue() : ''; 
                if (!codeToCopy) {
                    alert('No corrected code to copy.');
                    console.warn('No corrected code to copy.');
                    return;
                }
                try {
                    await navigator.clipboard.writeText(codeToCopy);
                    copyCorrectedCodeButton.textContent = 'Copied!';
                    copyCorrectedCodeButton.classList.add('bg-green-600', 'from-green-600', 'to-green-700');
                    copyCorrectedCodeButton.classList.remove('from-pink-500', 'to-purple-600', 'hover:from-pink-600', 'hover:to-purple-700');

                    setTimeout(() => {
                        copyCorrectedCodeButton.textContent = 'Copy Corrected Code';
                        copyCorrectedCodeButton.classList.remove('bg-green-600', 'from-green-600', 'to-green-700');
                        copyCorrectedCodeButton.classList.add('from-pink-500', 'to-purple-600', 'hover:from-pink-600', 'hover:to-purple-700');
                    }, 2000);
                } catch (err) {
                    console.error('Failed to copy text: ', err);
                    copyCorrectedCodeButton.textContent = 'Failed!';
                    copyCorrectedCodeButton.classList.add('bg-red-600', 'from-red-600', 'to-red-700');
                    copyCorrectedCodeButton.classList.remove('from-pink-500', 'to-purple-600', 'hover:from-pink-600', 'hover:to-purple-700');
                    setTimeout(() => {
                        copyCorrectedCodeButton.textContent = 'Copy Corrected Code';
                        copyCorrectedCodeButton.classList.remove('bg-red-600', 'from-red-600', 'to-red-700');
                        copyCorrectedCodeButton.classList.add('from-pink-500', 'to-purple-600', 'hover:from-pink-600', 'hover:to-purple-700');
                    }, 2000);
                    alert('Failed to copy code. Please copy manually or check browser permissions.');
                }
            });

            window.addEventListener('hashchange', () => {
                if (window.location.hash === '#history') {
                    resultsSection.classList.add('hidden');
                    historySection.classList.remove('hidden');
                    // loadHistory will be called by onAuthStateChanged when user state is known
                } else {
                    historySection.classList.add('hidden');
                    resultsSection.classList.remove('hidden');
                    // Reload the results from session storage if returning from history view
                    const currentStoredResults = sessionStorage.getItem('debugResults');
                    const currentStoredLanguage = sessionStorage.getItem('debugLanguage');
                    const currentStoredInputCode = sessionStorage.getItem('debugInputCode'); 

                    if (currentStoredResults && currentStoredLanguage) {
                        try {
                            const debugData = JSON.parse(currentStoredResults);
                            displayDebugResults(debugData, currentStoredLanguage);
                            currentDebugData = { debugOutput: debugData, language: currentStoredLanguage, inputCode: currentStoredInputCode };
                            if (sessionStorage.getItem('loggedInUserId')) {
                                saveDebugSessionButton.classList.remove('hidden');
                            } else {
                                saveDebugSessionButton.classList.add('hidden');
                            }
                            if (debugData.corrected_code && debugData.corrected_code.trim() !== '') {
                                copyCorrectedCodeButton.classList.remove('hidden');
                            } else {
                                copyCorrectedCodeButton.classList.add('hidden');
                            }
                        } catch (e) {
                             console.error('Error parsing stored results on hashchange (fallback):', e);
                             debugResultsContainer.innerHTML = '<p class="text-red-400">Error loading previous session. Please go back to the <a href="index.html" class="text-blue-300 hover:text-pink-300">home page</a> to debug some code.</p>';
                             saveDebugSessionButton.classList.add('hidden');
                             copyCorrectedCodeButton.classList.add('hidden');
                        }
                    } else {
                        debugResultsContainer.innerHTML = '<p class="text-gray-400">No debugging results found. Please go back to the <a href="index.html" class="text-blue-300 hover:text-pink-300">home page</a> to debug some code.</p>';
                        saveDebugSessionButton.classList.add('hidden');
                        copyCorrectedCodeButton.classList.add('hidden');
                    }
                }
            });
        });

        /**
         * Dynamically displays the structured debug results in the UI.
         * @param {object} debugData - The JSON object containing structured debug information.
         * @param {string} language - The language of the code, used for syntax highlighting.
         */
        function displayDebugResults(debugData, language) {
            const container = document.getElementById('debugResultsContainer');
            container.innerHTML = ''; // Clear previous results

            // Helper to get CodeMirror mode name
            function getCodeMirrorMode(lang) {
                switch (lang) {
                    case 'python':
                        return 'python';
                    case 'java':
                        return 'text/x-java';
                    case 'javascript':
                        return 'javascript';
                    default:
                        return 'text/plain';
                }
            }

            // Helper to create a section
            const createSection = (title, content, isCode = false) => {
                const sectionDiv = document.createElement('div');
                sectionDiv.classList.add('debug-section');

                const headerDiv = document.createElement('div');
                headerDiv.classList.add('flex', 'justify-between', 'items-center', 'mb-4', 'pb-2', 'border-b', 'border-gray-600'); 

                const titleElem = document.createElement('h3');
                titleElem.textContent = title;
                headerDiv.appendChild(titleElem);
                
                sectionDiv.appendChild(headerDiv);

                if (Array.isArray(content)) {
                    if (content.length > 0) {
                        const ul = document.createElement('ul');
                        content.forEach(item => {
                            const li = document.createElement('li');
                            li.textContent = item;
                            ul.appendChild(li);
                        });
                        sectionDiv.appendChild(ul);
                    } else {
                        const p = document.createElement('p');
                        p.textContent = 'No specific details provided.';
                        sectionDiv.appendChild(p);
                    }
                } else if (isCode) {
                    // Create a div for CodeMirror to attach to
                    const codeMirrorContainer = document.createElement('div');
                    codeMirrorContainer.classList.add('CodeMirror-container'); // Optional class for styling
                    codeMirrorContainer.style.height = 'auto'; // Let content define height
                    codeMirrorContainer.style.minHeight = '200px'; // Minimum height

                    sectionDiv.appendChild(codeMirrorContainer);

                    // Initialize CodeMirror instance for the corrected code output
                    outputEditor = CodeMirror(codeMirrorContainer, {
                        value: content,
                        mode: getCodeMirrorMode(language),
                        theme: 'dracula',
                        lineNumbers: true,
                        readOnly: true, // Make it read-only
                        indentUnit: 4,
                        tabSize: 4,
                        indentWithTabs: false,
                        autoCloseBrackets: true,
                        matchBrackets: true,
                    });

                    // Auto-resize CodeMirror to fit its content initially and on refresh
                    if (outputEditor) {
                        // We rely on CodeMirror's internal sizing and refresh for height
                        // The previous line outputEditor.setSize(null, outputEditor.getScrollInfo().height + 10); is removed
                        // as it caused the infinite expansion.
                        outputEditor.refresh(); 
                    }
                    
                    // Add a ResizeObserver to re-render CodeMirror if its container resizes
                    const resizeObserver = new ResizeObserver(entries => {
                        for (let entry of entries) {
                            if (entry.target === codeMirrorContainer) {
                                if (outputEditor) {
                                    outputEditor.refresh(); // Tell CodeMirror to re-calculate its size
                                }
                            }
                        }
                    });
                    resizeObserver.observe(codeMirrorContainer);


                } else {
                    const p = document.createElement('p');
                    p.textContent = content;
                    sectionDiv.appendChild(p);
                }
                return sectionDiv;
            };

            // Add all the debug sections
            container.appendChild(createSection('Code Summary', debugData.summary || 'No summary provided.'));
            container.appendChild(createSection('Problems', debugData.problems || []));
            container.appendChild(createSection('Causes', debugData.causes || []));
            container.appendChild(createSection('Solutions', debugData.solutions || []));
            container.appendChild(createSection('Prevention', debugData.prevention || []));
            
            // The Corrected Code section will now be rendered by CodeMirror
            if (debugData.corrected_code && debugData.corrected_code.trim() !== '') {
                container.appendChild(createSection('Corrected Code', debugData.corrected_code, true)); 
            } else {
                container.appendChild(createSection('Corrected Code', 'No specific corrected code provided or needed.'));
            }
        }
    </script>
