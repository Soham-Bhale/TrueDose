<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogicLens - Debug History</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/dracula.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Your existing styles from style.css and results.html for .debug-section etc. */
        .debug-section {
            background-color: rgba(40, 40, 40, 0.7);
            border-left: 4px solid #9370db;
            padding: 1rem 1.5rem;
            margin-bottom: 1rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }
        .debug-section h3 {
            color: #87ceeb;
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 0.8rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid rgba(135, 206, 235, 0.3);
        }
        .debug-section p, .debug-section ul {
            color: #e0e0e0;
            font-size: 0.95rem;
            line-height: 1.6;
        }
        .debug-section ul {
            list-style-type: disc;
            margin-left: 1.5rem;
            padding-left: 0;
        }
        .debug-section pre {
            padding: 1rem;
            border-radius: 8px;
            overflow-x: auto;
            font-family: 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
            font-size: 0.9rem;
            margin-top: 1rem;
        }
        .hljs {
            background: #282a36 !important;
            color: #f8f8f2 !important;
            border: 1px solid #6a5acd !important;
            border-radius: 8px;
            display: block;
            padding: 1rem !important;
        }
        .hljs-ln-line {
            color: #87ceeb;
        }
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            visibility: hidden;
            opacity: 0;
            transition: visibility 0s, opacity 0.3s ease;
        }
        .loading-overlay.visible {
            visibility: visible;
            opacity: 1;
        }
        .spinner {
            border: 8px solid #f3f3f3;
            border-top: 8px solid #ff69b4;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .history-item-card {
            background-color: rgba(50, 50, 50, 0.7);
            border-radius: 10px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .history-item-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
        }
        .history-item-card button {
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-weight: 600;
            transition: background-color 0.2s ease;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-purple-900 via-blue-900 to-black min-h-screen flex flex-col text-white">
    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner"></div>
    </div>

    <header class="p-4 md:p-6 bg-purple-900 bg-opacity-70 shadow-lg rounded-b-xl mx-4 mt-4 md:mx-8 md:mt-8 flex justify-between items-center">
        <h1 class="text-3xl md:text-4xl font-bold text-pink-300">LogicLens</h1>
        <nav class="flex space-x-4 md:space-x-6">
            <a href="index.html" class="nav-link">Home</a>
            <a href="about.html" class="nav-link">About Us</a>
            <a href="login.html" id="navLogin" class="nav-link">Login</a>
            <a href="signup.html" id="navSignup" class="nav-link">Sign Up</a>
            <a href="results.html#history" id="navHistory" class="nav-link hidden">History</a>
            <span id="userEmailDisplay" class="text-white text-md font-medium hidden md:block"></span>
            <button id="navLogout" class="nav-link hidden bg-red-600 hover:bg-red-700 px-3 py-1 rounded-md">Logout</button>
        </nav>
    </header>

    <main class="flex-grow container mx-auto p-4 md:p-8 flex flex-col items-center justify-center">
        <section class="bg-gray-800 bg-opacity-85 shadow-2xl backdrop-filter backdrop-blur-sm p-6 md:p-10 rounded-2xl border border-purple-700 w-full max-w-3xl">
            <h2 class="text-2xl md:text-3xl font-semibold text-pink-300 mb-6 text-center">Your Debug History</h2>
            <p class="text-gray-400 text-center mb-6" id="userIdDisplay"></p>

            <div id="historyListContainer" class="w-full">
                <p class="text-gray-400 text-center">Loading history...</p>
            </div>

            <!-- Detail View for a single history item -->
            <div id="historyDetailView" class="hidden mt-8 w-full">
                <h3 class="text-xl font-semibold text-blue-300 mb-4 text-center">Session Details</h3>
                <div id="detailContent" class="debug-results-container p-4 bg-gray-900 rounded-lg">
                    <!-- Details will be loaded here -->
                </div>
                <button id="backToHistoryButton" class="mt-6 w-full py-2 px-4 rounded-lg bg-gray-600 hover:bg-gray-700 text-white font-bold transition duration-300 ease-in-out">
                    Back to History List
                </button>
            </div>
        </section>
    </main>

    <footer class="p-4 md:p-6 bg-black bg-opacity-70 shadow-inner rounded-t-xl mx-4 mb-4 md:mx-8 md:mb-8 text-center text-gray-400 text-sm">
        &copy; 2025 LogicLens. All rights reserved.
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script type="module">
        // Firebase SDK imports
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, addDoc, deleteDoc, collection, query, serverTimestamp, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        
        // Firebase Client-side Configuration (Hardcoded for local development)
        const firebaseConfig = {
          apiKey: "AIzaSyCaSUNkEUPveP1m9X4HmMHsrl570GXUCDg",
          authDomain: "logiclens-882c6.firebaseapp.com",
          projectId: "logiclens-882c6",
          storageBucket: "logiclens-882c6.firebasestorage.app",
          messagingSenderId: "522388336403",
          appId: "1:522388336403:web:a597fcc2c8bf526a3f74e6",
          measurementId: "G-N528RTE02G"
        };
        const appId = firebaseConfig.projectId; // Using projectId for consistency with backend artifact paths

        let app;
        let db;
        let auth;
        let currentUserId = null; 

        if (Object.keys(firebaseConfig).length > 0) {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
            console.log("Firebase initialized.");

            // Initial sign-in or check auth state
            onAuthStateChanged(auth, async (user) => {
                const userIdDisplay = document.getElementById('userIdDisplay');
                if (user) {
                    currentUserId = user.uid;
                    sessionStorage.setItem('loggedInUserId', user.uid);
                    sessionStorage.setItem('loggedInUserEmail', user.email || 'Anonymous User');
                    userIdDisplay.textContent = `Your User ID: ${currentUserId}`;
                    console.log("User authenticated:", currentUserId);
                    await fetchAndDisplayHistory(); // Load history once authenticated
                } else {
                    currentUserId = null;
                    sessionStorage.removeItem('loggedInUserId');
                    sessionStorage.removeItem('loggedInUserEmail');
                    sessionStorage.removeItem('idToken');
                    console.log("No user signed in. Attempting anonymous sign-in...");
                    try {
                        // For local development, this will typically sign in anonymously
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                            console.log("Signed in with custom token.");
                        } else {
                            await signInAnonymously(auth);
                            console.log("Signed in anonymously.");
                        }
                    } catch (error) {
                        console.error("Firebase Auth Error:", error);
                        userIdDisplay.textContent = "User ID: Authentication Failed.";
                    }
                }
                updateNavForAuthState(); // Update navigation on auth state change
            });

        } else {
            console.error("Firebase config is missing. Cannot initialize Firebase.");
            document.getElementById('userIdDisplay').textContent = "User ID: Firebase not configured.";
        }

        // Function to fetch and display history
        async function fetchAndDisplayHistory() {
            const historyListContainer = document.getElementById('historyListContainer');
            const loadingOverlay = document.getElementById('loadingOverlay');
            const historyDetailView = document.getElementById('historyDetailView');
            loadingOverlay.classList.add('visible');
            historyListContainer.innerHTML = '<p class="text-gray-400 text-center">Loading history...</p>';
            historyDetailView.classList.add('hidden'); // Hide detail view when loading list

            if (!currentUserId || !sessionStorage.getItem('idToken')) {
                historyListContainer.innerHTML = '<p class="text-red-400 text-center">You must be logged in to view your history. Please <a href="login.html" class="text-blue-300 hover:underline">Login</a> or <a href="signup.html" class="text-blue-300 hover:underline">Sign Up</a>.</p>';
                loadingOverlay.classList.remove('visible');
                return;
            }

            try {
                const idToken = sessionStorage.getItem('idToken'); // Get JWT token
                if (!idToken) {
                    historyListContainer.innerHTML = '<p class="text-red-400 text-center">Authentication token missing. Please log in again to load history.</p>';
                    loadingOverlay.classList.remove('visible');
                    return;
                }

                // Corrected backendUrl for get-history (no user ID in path)
                const response = await fetch(`http://127.0.0.1:5000/get-history`, {
                    method: 'GET',
                    headers: { 
                        'x-access-token': idToken // Send JWT token
                    }
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || `Failed to fetch history with status: ${response.status}`);
                }
                const result = await response.json();
                const history = result.history; // Access the 'history' array from the response
                
                historyListContainer.innerHTML = ''; // Clear loading message

                if (history.length === 0) {
                    historyListContainer.innerHTML = '<p class="text-gray-400 text-center">No debug history found for this account. Debug some code on the <a href="index.html" class="text-blue-300 hover:underline">Home page</a> to save your first session!</p>';
                } else {
                    history.forEach(session => {
                        const sessionCard = document.createElement('div'); // Changed to div for sessionCard as per previous history.html structure
                        sessionCard.classList.add('history-item-card');
                        
                        // Parse debugOutput which is stored as a JSON string
                        let parsedDebugOutput;
                        try {
                            parsedDebugOutput = JSON.parse(session.debugOutput);
                        } catch (e) {
                            console.error('Error parsing debugOutput for history item:', session.id, e);
                            parsedDebugOutput = {}; // Fallback to empty object
                        }

                        // Convert Firestore Timestamp to Date object
                        const sessionDate = session.timestamp && session.timestamp._seconds ? new Date(session.timestamp._seconds * 1000).toLocaleString() : 'N/A';
                        const summary = parsedDebugOutput.summary || 'No Summary';
                        const language = session.language || 'Unknown';

                        sessionCard.innerHTML = `
                            <p class="text-blue-200 text-lg font-bold">${summary}</p>
                            <p class="text-gray-300 text-sm">Language: ${language}</p>
                            <p class="text-gray-400 text-xs">Debugged on: ${sessionDate}</p>
                            <div class="flex flex-col sm:flex-row gap-2 mt-2">
                                <button class="view-btn bg-purple-600 hover:bg-purple-700 text-white" data-session-id="${session.id}">View Details</button>
                                <button class="delete-btn bg-red-600 hover:bg-red-700 text-white" data-session-id="${session.id}">Delete</button>
                            </div>
                        `;
                        historyListContainer.appendChild(sessionCard);
                    });

                    // Attach event listeners to newly created buttons
                    document.querySelectorAll('.view-btn').forEach(button => {
                        // Pass the entire session object directly for easier access in viewSessionDetails
                        const sessionId = button.dataset.sessionId;
                        const sessionToView = history.find(s => s.id === sessionId);
                        if (sessionToView) {
                            button.addEventListener('click', () => viewSessionDetails(sessionToView));
                        }
                    });
                    document.querySelectorAll('.delete-btn').forEach(button => {
                        button.addEventListener('click', () => deleteSession(button.dataset.sessionId));
                    });
                }

            } catch (error) {
                console.error("Error fetching history:", error);
                historyListContainer.innerHTML = `<p class="text-red-400 text-center">Error loading history: ${error.message}. Please try refreshing the page.</p>`;
            } finally {
                loadingOverlay.classList.remove('visible');
            }
        }

        // Function to display detailed session view
        function viewSessionDetails(session) {
            if (!session) {
                console.error("Session data is missing.");
                return;
            }

            const historyListContainer = document.getElementById('historyListContainer');
            const historyDetailView = document.getElementById('historyDetailView');
            const detailContent = document.getElementById('detailContent');

            historyListContainer.classList.add('hidden'); // Hide list
            historyDetailView.classList.remove('hidden'); // Show detail view
            detailContent.innerHTML = ''; // Clear previous details

            let parsedDebugOutput;
            try {
                parsedDebugOutput = JSON.parse(session.debugOutput);
            } catch (e) {
                console.error('Error parsing debugOutput for detailed view:', session.id, e);
                parsedDebugOutput = {}; // Fallback
            }

            const debugData = parsedDebugOutput;
            const language = session.language || 'text'; // Use language from stored data

            const createSection = (title, content, isCode = false) => {
                const sectionDiv = document.createElement('div');
                sectionDiv.classList.add('debug-section');

                const headerDiv = document.createElement('div');
                headerDiv.classList.add('flex', 'justify-between', 'items-center', 'mb-4', 'pb-2', 'border-b', 'border-gray-600'); 

                const titleElem = document.createElement('h3');
                titleElem.textContent = title;
                headerDiv.appendChild(titleElem);
                
                sectionDiv.appendChild(headerDiv);

                if (Array.isArray(content)) {
                    if (content.length > 0) {
                        const ul = document.createElement('ul');
                        content.forEach(item => {
                            const li = document.createElement('li');
                            li.textContent = item;
                            ul.appendChild(li);
                        });
                        sectionDiv.appendChild(ul);
                    } else {
                        const p = document.createElement('p');
                        p.textContent = 'No specific details provided.';
                        sectionDiv.appendChild(p);
                    }
                } else if (isCode) {
                    const pre = document.createElement('pre');
                    const codeElem = document.createElement('code');
                    codeElem.classList.add('language-' + language); 
                    codeElem.textContent = content;
                    pre.appendChild(codeElem);
                    sectionDiv.appendChild(pre);
                } else {
                    const p = document.createElement('p');
                    p.textContent = content;
                    sectionDiv.appendChild(p);
                }
                return sectionDiv;
            };

            detailContent.appendChild(createSection('Code Summary', debugData.summary || 'No summary provided.'));
            detailContent.appendChild(createSection('Original Input Code', session.inputCode || 'N/A', true)); // Use session.inputCode
            detailContent.appendChild(createSection('Problems', debugData.problems || []));
            detailContent.appendChild(createSection('Causes', debugData.causes || []));
            detailContent.appendChild(createSection('Solutions', debugData.solutions || []));
            detailContent.appendChild(createSection('Prevention', debugData.prevention || []));
            
            if (debugData.corrected_code && debugData.corrected_code.trim() !== '') {
                detailContent.appendChild(createSection('Corrected Code', debugData.corrected_code, true));
            } else {
                detailContent.appendChild(createSection('Corrected Code', 'No specific corrected code provided or needed.'));
            }

            hljs.highlightAll(); // Re-highlight all code blocks in the detail view
        }

        // Function to handle delete session
        async function deleteSession(sessionId) {
            if (!confirm("Are you sure you want to delete this session?")) {
                return;
            }

            const loadingOverlay = document.getElementById('loadingOverlay');
            loadingOverlay.classList.add('visible');
            try {
                const idToken = sessionStorage.getItem('idToken'); // Get JWT token
                if (!idToken) {
                    alert("Authentication token missing. Please log in again to delete history.");
                    loadingOverlay.classList.remove('visible');
                    return;
                }

                // Corrected backendUrl for delete-history (only session ID in path)
                const backendUrl = `http://127.0.0.1:5000/delete-history/${sessionId}`; 

                const response = await fetch(backendUrl, {
                    method: 'DELETE',
                    headers: { 
                        'x-access-token': idToken // Send JWT token
                    }
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || `Failed to delete history with status: ${response.status}`);
                }
                alert("Session deleted successfully!");
                fetchAndDisplayHistory(); // Refresh the list
            } catch (error) {
                console.error("Error deleting session:", error);
                alert("Failed to delete session: " + error.message);
            } finally {
                loadingOverlay.classList.remove('visible');
            }
        }

        // --- Common Navigation Logic ---
        // This script handles the dynamic navigation bar based on authentication status.
        // It's designed to be reusable across all pages.
        function updateNavForAuthState() {
            const loggedInUserId = sessionStorage.getItem('loggedInUserId');
            const loggedInUserEmail = sessionStorage.getItem('loggedInUserEmail');
            
            const navLogin = document.getElementById('navLogin');
            const navSignup = document.getElementById('navSignup');
            const navHistory = document.getElementById('navHistory');
            const navLogout = document.getElementById('navLogout');
            const userEmailDisplay = document.getElementById('userEmailDisplay');

            if (loggedInUserId) { // Check for loggedInUserId, not just presence of value
                navLogin.classList.add('hidden');
                navSignup.classList.add('hidden');
                navHistory.classList.remove('hidden');
                navLogout.classList.remove('hidden');
                userEmailDisplay.classList.remove('hidden');
                userEmailDisplay.textContent = `(${loggedInUserEmail})`;

                // Ensure listeners are only added once
                if (!navLogout.hasListener) {
                    navLogout.addEventListener('click', async function(e) {
                        e.preventDefault();
                        // Client-side Firebase signOut
                        // In history.html, 'auth' is available from the main script block.
                        if (auth) {
                            try {
                                await signOut(auth); // Sign out from Firebase client
                                console.log("Firebase client-side signed out.");
                            } catch (error) {
                                console.error("Error signing out from Firebase client:", error);
                            }
                        }
                        sessionStorage.clear(); // Clear all session data
                        alert('You have been logged out.');
                        window.location.href = 'index.html'; // Redirect to home after logout
                    });
                    navLogout.hasListener = true;
                }
                if (!navHistory.hasListener) {
                    navHistory.addEventListener('click', function(e) {
                        e.preventDefault();
                        window.location.href = 'results.html#history'; // Navigate to history section
                    });
                    navHistory.hasListener = true;
                }

            } else {
                navLogin.classList.remove('hidden');
                navSignup.classList.remove('hidden');
                navHistory.classList.add('hidden');
                navLogout.classList.add('hidden');
                userEmailDisplay.classList.add('hidden');
                userEmailDisplay.textContent = '';
            }
        }

        // --- Main Script Execution Flow ---
        document.addEventListener('DOMContentLoaded', function() {
            console.log("history.html script loaded and DOMContentLoaded fired.");
            updateNavForAuthState(); // Initial call to set nav state for the navigation bar
        });
    </script>
</body>
</html>
